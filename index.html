<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi SWI France</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
            background-color: white;
        }
        footer {
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
        }
        /* Style ajouté pour le lien généré dynamiquement */
        a.api-link {
            color: #0066cc;
            text-decoration: none;
            word-wrap: break-word;
        }
        a.api-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Carte SWI de la France</h1>
    <p>Mise à jour automatique quotidienne (données data.gouv.fr)</p>
    
    <div>
        <img src="static/carte.png" alt="Carte SWI France">
    </div>

    <!-- Zone de texte qui sera remplie automatiquement par JavaScript -->
    <div style="margin-top: 15px; font-size: 0.9em; color: #555; text-align: center;">
        <p id="info-api">Recherche de la source des données en cours...</p>
    </div>

    <footer>
        <p>Généré automatiquement via GitHub Actions</p>
    </footer>

    <!-- Script pour lire le fichier info.json généré par Python -->
    <script>
        fetch('static/info.json')
            .then(response => response.json())
            .then(data => {
                const apiText = `Données du <strong>${data.date}</strong>.<br>Source (API la plus récente sélectionnée) : <a class="api-link" href="${data.api_url}" target="_blank">${data.api_url}</a>`;
                document.getElementById('info-api').innerHTML = apiText;
            })
            .catch(error => {
                console.error('Erreur lors du chargement des infos API:', error);
                document.getElementById('info-api').innerText = "Source des données : Météo-France (data.gouv.fr)";
            });
    </script>
</body>
</html>
