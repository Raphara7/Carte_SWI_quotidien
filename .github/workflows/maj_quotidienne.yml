name: Mise à jour Carte SWI

# Quand lancer ce script ?
on:
  schedule:
    - cron: '0 8 * * *' # Tous les jours à 8h00 UTC
  workflow_dispatch: # Permet de lancer manuellement avec un bouton

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v3

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécution du script Python
        run: python main.py

      - name: Déploiement sur la branche gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
